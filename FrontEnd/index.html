<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner-ring"></div>
        <p class="loading-label">Cooking something...</p>
    </div>

    <!-- Header -->
    <header class="header">
        <button class="icon-btn back-btn" id="back-btn" aria-label="Go back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
        </button>
        <h1 class="app-title" id="header-title">AI Studio</h1>
        <button class="icon-btn grid-btn" id="grid-btn" aria-label="Grid view">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            </svg>
        </button>
    </header>

    <!-- Screens Container -->
    <div class="screens-container">

        <!-- Screen: Studio (Photo Editing) -->
        <div id="screen-studio" class="screen active">
            <div class="image-section" id="image-section">
                <input type="file" accept="image/*" id="img_input" class="hidden-input">
                <label for="img_input" class="upload-placeholder" id="upload-placeholder">
                    <div class="upload-icon-ring">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <span class="upload-label">Upload Image</span>
                    <span class="upload-sub">or just type a prompt below</span>
                </label>
                <img src="" alt="Preview" id="img_preview" class="img-preview hidden">
                <div class="glow-border"></div>
            </div>
        </div>

        <!-- Screen: Mind Map -->
        <div id="screen-mindmap" class="screen">
            <div class="mindmap-scroll-outer" id="mindmap-scroll-outer">
                <div class="mindmap-canvas" id="mindmap-canvas">
                    <!-- SVG and nodes rendered here by JS -->
                </div>
            </div>
        </div>

        <!-- Screen: Flashcards -->
        <div id="screen-flashcards" class="screen">
            <div class="flashcards-layout">
                <div class="card-meta-bar">
                    <span class="card-counter" id="card-counter">1 / 1</span>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="card-scene">
                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-inner" id="flashcard-inner">
                            <div class="flashcard-face card-front">
                                <span class="face-chip">Question</span>
                                <p id="card-question"></p>
                            </div>
                            <div class="flashcard-face card-back">
                                <span class="face-chip answer-chip">Answer</span>
                                <p id="card-answer"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-controls">
                    <button class="ctrl-btn" id="card-prev" aria-label="Previous card">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5M12 5l-7 7 7 7"/>
                        </svg>
                    </button>
                    <span class="tap-hint">Tap card to flip</span>
                    <button class="ctrl-btn" id="card-next" aria-label="Next card">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Screen: Summary -->
        <div id="screen-summary" class="screen">
            <div class="summary-scroll" id="summary-scroll">
                <div class="summary-card">
                    <div class="summary-tag">Summary</div>
                    <h2 id="summary-title"></h2>
                    <ul id="summary-points" class="summary-list"></ul>
                </div>
            </div>
        </div>

    </div>
    <!-- /.screens-container -->
    <!-- Chat Section -->
    <div class="chat-section">
        <div class="image-chip hidden" id="image-chip">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span id="chip-filename">image.jpg</span>
            <button class="chip-remove" id="chip-remove" aria-label="Remove image">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="input-wrapper" id="input-wrapper">
            <label for="img_input" class="attach-btn" title="Attach image" id="attach-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                </svg>
            </label>
            <textarea id="user_msg" rows="1" placeholder="Ask anything..."></textarea>
            <button class="send-btn" id="request_send" aria-label="Send message">
                <svg width="15" height="15" viewBox="0 0 512 512">
                    <path fill="currentColor" d="M256 277.333v-42.666H122.027L64 42.667L469.333 256L64 469.333l57.6-192z"/>
                </svg>
            </button>
        </div>
    </div>

</div><!-- /.app-container -->

<script src="script.js" defer></script>
</body>
</html>
